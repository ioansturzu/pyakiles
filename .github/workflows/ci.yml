name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      
    - name: Set up Python
      run: uv python install 3.11
      
    - name: Install dependencies
      run: uv sync --all-extras --dev
      
    - name: Run tests
      run: uv run pytest
      
    - name: Generate Potential/Density Data
      run: |
        uv run examples/python/potential_density.py
        
    - name: Upload Python Potential/Density Results
      uses: actions/upload-artifact@v4
      with:
        name: python-results
        path: |
          examples/python/potential_density_results.json
          examples/python/potential_density.png

    - name: Generate Temperature/Heatflux Data
      run: uv run examples/python/temperature_heatflux.py --test

    - name: Upload Python Temperature/Heatflux Results
      uses: actions/upload-artifact@v4
      with:
        name: python-fig02-results
        path: |
           examples/python/temperature_heatflux_results.json
           examples/python/temperature_heatflux_temps.png
           examples/python/temperature_heatflux_heatflux.png

    - name: Generate EEDF Slices Data
      run: uv run examples/python/eedf_slices.py

    - name: Upload Python EEDF Slices Results
      uses: actions/upload-artifact@v4
      with:
        name: python-fig03-results
        path: |
           examples/python/eedf_slices_results.json
           examples/python/eedf_slices.png

  matlab-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up MATLAB
      uses: matlab-actions/setup-matlab@v2
      
    - name: Run Tests
      uses: matlab-actions/run-tests@v2
      with:
        source-folder: matlab_port/src
        select-by-folder: matlab_port/tests_matlab
        
    - name: Run Potential/Density Example
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath('matlab_port')); 
          potential_density
          
    - name: Upload MATLAB Results
      uses: actions/upload-artifact@v4
      with:
        name: matlab-results
        path: |
          sims_potential_density/potential_density_results.json
          sims_potential_density/potential_density.png

    - name: Run Temperature/Heatflux Example
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath('matlab_port'));
          temperature_heatflux(true);

    - name: Upload MATLAB Temperature/Heatflux Results
      uses: actions/upload-artifact@v4
      with:
        name: matlab-fig02-results
        path: |
          matlab_port/examples/sims_temperature_heatflux/temperature_heatflux_results.json
          matlab_port/examples/sims_temperature_heatflux/temperatures.png
          matlab_port/examples/sims_temperature_heatflux/heatflux.png

    - name: Run EEDF Slices Example
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath('matlab_port'));
          eedf_slices;

    - name: Upload MATLAB EEDF Slices Results
      uses: actions/upload-artifact@v4
      with:
        name: matlab-fig03-results
        path: |
          matlab_port/examples/sims_eedf_slices/eedf_slices_results.json
          matlab_port/examples/sims_eedf_slices/eedf_slices.png

  compare-results:
    needs: [python-tests, matlab-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Python Results
      uses: actions/download-artifact@v4
      with:
        name: python-results
        path: results/python
        
    - name: Download MATLAB Results
      uses: actions/download-artifact@v4
      with:
        name: matlab-results
        path: results/matlab

    - name: Download Python Temperature/Heatflux Results
      uses: actions/download-artifact@v4
      with:
        name: python-fig02-results
        path: results/python

    - name: Download MATLAB Temperature/Heatflux Results
      uses: actions/download-artifact@v4
      with:
        name: matlab-fig02-results
        path: results/matlab

    - name: Download Python EEDF Slices Results
      uses: actions/download-artifact@v4
      with:
        name: python-fig03-results
        path: results/python

    - name: Download MATLAB EEDF Slices Results
      uses: actions/download-artifact@v4
      with:
        name: matlab-fig03-results
        path: results/matlab

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      
    - name: Set up Python
      run: uv python install 3.11
      
    - name: Compare Results
      run: |
        echo "Comparing Potential/Density Results..."
        uv run python scripts/compare_results.py results/python/potential_density_results.json results/matlab/potential_density_results.json
        
        echo "Comparing Temperature/Heatflux Results..."
        uv run python scripts/compare_results.py results/python/temperature_heatflux_results.json results/matlab/temperature_heatflux_results.json
        
        echo "Comparing EEDF Slices Results..."
        uv run python scripts/compare_results.py results/python/eedf_slices_results.json results/matlab/eedf_slices_results.json
